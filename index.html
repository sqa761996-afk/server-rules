<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>قوانين سيرفر رسبكت تاون</title>
<style>
body {
  background: #0a0a0a;
  color: #ffffff;
  font-family: "Arial", sans-serif;
  margin: 0;
  padding: 0;
}
header {
  background: #1a1a1a;
  padding: 20px;
  border-bottom: 4px solid red;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1 {
  margin: 0;
  font-size: 2em;
  color: #ff0000;
  text-align: center;
  flex: 1;
}
/* زر أعلى يسار */
.rule-btn {
  background: #ff0000;
  color: #fff;
  padding: 10px 20px;
  text-decoration: none;
  font-weight: bold;
  border-radius: 5px;
  transition: all 0.3s ease;
  box-shadow: 0 0 0 rgba(255,0,0,0.5);
}
.rule-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 10px rgba(255,0,0,0.7);
}
/* القوانين */
.container {
  max-width: 800px;
  margin: 40px auto;
  padding: 0 20px;
}
.rule {
  background: #1e1e1e;
  border-left: 5px solid red;
  padding: 15px;
  margin-bottom: 15px;
  font-size: 1.1em;
}
.rule span {
  font-weight: bold;
  margin-right: 10px;
}
/* الفوتر */
footer {
  text-align: center;
  padding: 20px;
  margin-top: 40px;
  border-top: 2px solid #333;
  color: #888;
}
</style>
</head>
<body>

<header>
  <a href="#container" class="rule-btn">📜 القوانين</a>
  <h1>قوانين السيرفر</h1>
</header>

<div class="container" id="container">
  <div class="rule"><span>❌</span> ممنوع RDM / VDM</div>
  <div class="rule"><span>🎭</span> الالتزام بالرول بلاي (RolePlay)</div>
  <div class="rule"><span>🧠</span> ممنوع Meta Gaming</div>
  <div class="rule"><span>⚠️</span> احترام جميع اللاعبين</div>
  <div class="rule"><span>🚓</span> الالتزام بقوانين الشرطة والعصابات داخل اللعبة</div>
  <div class="rule"><span>💬</span> ممنوع السب أو الشتائم في الديسكورد أو اللعبة</div>
  <div class="rule"><span>🔒</span> احترام الخصوصية وعدم نشر معلومات الآخرين</div>
</div>

<footer>
  © 2026 سيرفرنا – جميع الحقوق محفوظة
</footer>

</body>
</html>
