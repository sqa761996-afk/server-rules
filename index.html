<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>قوانين سيرفرنا</title>
<style>
body {
  background: #0a0a0a;
  color: #ffffff;
  font-family: "Arial", sans-serif;
  margin: 0;
  padding: 0;
}
header {
  background: #1a1a1a;
  padding: 20px;
  text-align: center;
  border-bottom: 4px solid red;
}
header h1 {
  margin: 0;
  font-size: 2em;
  color: #ff0000;
}
.container {
  max-width: 800px;
  margin: 40px auto;
  padding: 0 20px;
}
.rule {
  background: #1e1e1e;
  border-left: 5px solid red;
  padding: 15px;
  margin-bottom: 15px;
  font-size: 1.1em;
}
.rule span {
  font-weight: bold;
  margin-right: 10px;
}
footer {
  text-align: center;
  padding: 20px;
  margin-top: 40px;
  border-top: 2px solid #333;
  color: #888;
}
</style>
</head>
<body>

<header>
  <h1>📜 قوانين السيرفر</h1>
</header>

<div class="container">
  <div class="rule"><span>❌</span> ممنوع RDM / VDM</div>
  <div class="rule"><span>🎭</span> الالتزام بالرول بلاي (RolePlay)</div>
  <div class="rule"><span>🧠</span> ممنوع Meta Gaming</div>
  <div class="rule"><span>⚠️</span> احترام جميع اللاعبين</div>
  <div class="rule"><span>🚓</span> الالتزام بقوانين الشرطة والعصابات داخل اللعبة</div>
  <div class="rule"><span>💬</span> ممنوع السب أو الشتائم في الديسكورد أو اللعبة</div>
  <div class="rule"><span>🔒</span> احترام الخصوصية وعدم نشر معلومات الآخرين</div>
</div>

<footer>
  © 2026 سيرفرنا – جميع الحقوق محفوظة
</footer>

</html>
